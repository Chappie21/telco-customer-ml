# Levantar todo:  cd app && docker compose up --build
#   Web: http://localhost:3000   API: http://localhost:8000/docs
services:
  api:
    build:
      context: ..                  # raíz del repo: la imagen copia los modelos de ml/
      dockerfile: app/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
